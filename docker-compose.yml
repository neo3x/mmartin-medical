version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: martin-postgres
    environment:
      POSTGRES_USER: martin
      POSTGRES_PASSWORD: martin_dev_password
      POSTGRES_DB: martin_medical
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U martin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - martin-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: martin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - martin-network

  # ChromaDB (Vector Database)
  chromadb:
    image: chromadb/chroma:latest
    container_name: martin-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - martin-network

  # MinIO (S3-compatible storage for development)
  minio:
    image: minio/minio:latest
    container_name: martin-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - martin-network

  # Next.js App (optional, for containerized development)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: martin-app
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://martin:martin_dev_password@postgres:5432/martin_medical
      - REDIS_URL=redis://redis:6379
      - CHROMA_URL=http://chromadb:8000
      - S3_ENDPOINT=http://minio:9000
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - martin-network
    command: npm run dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local
  minio_data:
    driver: local

networks:
  martin-network:
    driver: bridge
